on:
  push:
    branches: main
  pull_request:
    branches: main
  merge_group:

name: ci

jobs:
  ci:
    uses: BristolMyersSquibb/blockr.ci/.github/workflows/ci.yaml@v0.1.1
    secrets: inherit
    permissions:
      contents: write

  # Type-check the hand-written JS in inst/js (tsconfig.json; opt-in
  # per file via // @ts-check). No build step — checking only.
  typecheck-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx -y -p typescript@~6.0.0 tsc

  # The chart's JavaScript in node with happy-dom: characterization
  # snapshots and scaling checks (tests/js/README.md), against both chart
  # engines. blockr.ui's controls load from a checkout of its default branch.
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BristolMyersSquibb/blockr.ui
          path: _blockr.ui
          token: ${{ secrets.BLOCKR_PAT || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        env:
          BLOCKR_UI_JS: ${{ github.workspace }}/_blockr.ui/inst/assets/js
      # The same tests against the v2 engine (inst/js/chart-v2/), which has to
      # reproduce v1's snapshots or list why not (tests/js/v2-differences.json).
      - run: npm run test:v2
        env:
          BLOCKR_UI_JS: ${{ github.workspace }}/_blockr.ui/inst/assets/js
