on:
  push:
    branches: main
  pull_request:
    branches: main
  merge_group:

name: ci

jobs:
  ci:
    uses: BristolMyersSquibb/blockr.ci/.github/workflows/ci.yaml@v0.1.1
    secrets: inherit
    permissions:
      contents: write

  # The JS that must stay green while the rewrite runs: the node tests, and
  # the strict gate on the rewritten core (eslint with the teardown rules,
  # strict tsc with tsconfig.core.json). The whole-tree lint and tsc run in
  # exit-criteria, red on the old code until the rewrite is done.
  # blockr.ui's controls load from a checkout of its default branch.
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BristolMyersSquibb/blockr.ui
          path: _blockr.ui
          token: ${{ secrets.BLOCKR_PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint:core
        if: always()
      - run: npm run typecheck:core
        if: always()
      - run: npm test
        if: always()
        env:
          BLOCKR_UI_JS: ${{ github.workspace }}/_blockr.ui/inst/assets/js

  # The rewrite's exit criteria (design.md section 11): dead code, lengths,
  # size budget, gates, coverage, feature links, browser tests, R CMD check.
  # tools/run-checks.sh runs every check and prints every report before it
  # fails, so one run shows the whole state.
  exit-criteria:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.BLOCKR_PAT || github.token }}
      NOT_CRAN: true
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BristolMyersSquibb/blockr.ui
          path: _blockr.ui
          token: ${{ secrets.BLOCKR_PAT || github.token }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::covr
            any::lintr
            any::xml2
            any::shinytest2
            any::chromote
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Exit criteria
        run: tools/run-checks.sh
        env:
          BLOCKR_UI_JS: ${{ github.workspace }}/_blockr.ui/inst/assets/js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-criteria-results
          path: |
            results/
            coverage/
